name: CI

on:
  push:
  pull_request:

# Actions are pinned to a commit, not to a tag that could be moved; the comment
# names the release. Update the commit and the comment together.
# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Check source file length
        run: python ../scripts/check_file_length.py
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Run tests
        run: npm test
      - name: Type check and build
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: UI is served with its security headers
        run: |
          curl --fail --silent --show-error "$BASE_URL/" | grep -q "PlantPulse Live-Ops"
          curl --silent --head "$BASE_URL/" | grep -i "^content-security-policy:"
      - name: API answers through the proxy
        run: curl --fail --silent --show-error "$BASE_URL/api/v1/health" | grep -q '"status":"ok"'
      - name: Stream reaches the client through Nginx without buffering
        run: |
          # Exit status 28 is curl's own time limit: both events may have arrived
          # although the connection closed late, so the captured events decide.
          # Any other failure (refused connection, HTTP error, reset) fails the step.
          status=0
          curl --fail --silent --show-error --no-buffer --max-time 20             "$BASE_URL/api/v1/stream?max_events=2" > stream.txt || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 28 ]; then
            echo "curl failed with status $status; captured output:"
            cat stream.txt
            exit 1
          fi
          for event in snapshot update; do
            if ! grep -q "^event: $event" stream.txt; then
              echo "no '$event' event was delivered; captured output:"
              cat stream.txt
              exit 1
            fi
          done
      - name: Fault injection round trip
        run: |
          curl --fail --silent --show-error -X POST "$BASE_URL/api/v1/simulate/trigger/ALM-207" > /dev/null
          curl --fail --silent --show-error "$BASE_URL/api/v1/state" | grep -q '"alarm_code":"ALM-207"'
      - name: Matrix download and upload round trip
        run: |
          curl --fail --silent --show-error -o matrix.xlsx "$BASE_URL/api/v1/matrix/export-sample"
          curl --fail --silent --show-error -X POST --data-binary @matrix.xlsx             -H "Content-Type: application/octet-stream"             "$BASE_URL/api/v1/matrix/upload?filename=matrix.xlsx" | grep -q '"rule_count":12'
      - name: Largest allowed upload, three at once, within the temp storage cap
        run: |
          # Generated inside the backend container, which has the spreadsheet library.
          # The script checks its own size against the backend's upload limit and
          # fails if it is over it or too far under it, so no size is repeated here.
          docker compose exec -T backend python - < scripts/make_large_workbook.py > big.xlsx
          for n in 1 2 3; do
            curl --silent --show-error -X POST --data-binary @big.xlsx -H "Content-Type: application/octet-stream" -o "upload_$n.json" -w "%{http_code}" "$BASE_URL/api/v1/matrix/upload?filename=big_$n.xlsx" > "status_$n.txt" &
          done
          wait
          for n in 1 2 3; do
            echo "upload $n: HTTP $(cat "status_$n.txt") $(cat "upload_$n.json")"
            test "$(cat "status_$n.txt")" = "200"
            grep -q '"rule_count":12' "upload_$n.json"
          done
          curl --fail --silent --show-error -X POST "$BASE_URL/api/v1/matrix/restore-default" > /dev/null
      - name: Containers do not run as root
        run: |
          # Assigned separately so the step fails if the command itself fails,
          # instead of comparing an empty string against "0".
          backend_uid="$(docker compose exec -T backend id -u)"
          frontend_uid="$(docker compose exec -T frontend id -u)"
          echo "backend uid=$backend_uid, frontend uid=$frontend_uid"
          [[ "$backend_uid" =~ ^[0-9]+$ && "$backend_uid" != "0" ]]
          [[ "$frontend_uid" =~ ^[0-9]+$ && "$frontend_uid" != "0" ]]
      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
