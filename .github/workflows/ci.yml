name: CI

on:
  push:
  pull_request:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Check source file length
        run: python ../scripts/check_file_length.py
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Run tests
        run: npm test
      - name: Type check and build
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: UI is served with its security headers
        run: |
          curl --fail --silent --show-error "$BASE_URL/" | grep -q "PlantPulse Live-Ops"
          curl --silent --head "$BASE_URL/" | grep -i "^content-security-policy:"
      - name: API answers through the proxy
        run: curl --fail --silent --show-error "$BASE_URL/api/v1/health" | grep -q '"status":"ok"'
      - name: Stream reaches the client through Nginx without buffering
        run: |
          curl --fail --silent --show-error --no-buffer --max-time 20             "$BASE_URL/api/v1/stream?max_events=2" > stream.txt
          grep -q "^event: snapshot" stream.txt
          grep -q "^event: update" stream.txt
      - name: Fault injection round trip
        run: |
          curl --fail --silent --show-error -X POST "$BASE_URL/api/v1/simulate/trigger/ALM-207" > /dev/null
          curl --fail --silent --show-error "$BASE_URL/api/v1/state" | grep -q '"alarm_code":"ALM-207"'
      - name: Matrix download and upload round trip
        run: |
          curl --fail --silent --show-error -o matrix.xlsx "$BASE_URL/api/v1/matrix/export-sample"
          curl --fail --silent --show-error -X POST --data-binary @matrix.xlsx             -H "Content-Type: application/octet-stream"             "$BASE_URL/api/v1/matrix/upload?filename=matrix.xlsx" | grep -q '"rule_count":12'
      - name: Containers do not run as root
        run: |
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"
      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
